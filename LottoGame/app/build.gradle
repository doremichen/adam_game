plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt)
}

android {
    signingConfigs {
        release {

            Properties properties = new Properties()
            InputStream inputStream = project.rootProject.file('local.properties').newDataInputStream()
            storeFile file("$rootDir/SignApk/SignedLotoGame.jks")
            properties.load(inputStream)


            def key_keyAlias = properties.getProperty('keystore.alias')
            def key_keyPassword = properties.getProperty('keystore.password')
            def key_storePassword = properties.getProperty('keystore.alias_password')

            keyAlias key_keyAlias
            keyPassword key_keyPassword
            storePassword key_storePassword
        }
    }
    namespace 'com.adam.app.lottogame'
    compileSdk 35

    defaultConfig {
        applicationId "com.adam.app.lottogame"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.release
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    viewBinding {
        enabled = true
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }
    flavorDimensions 'phone'
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.room
    implementation libs.gson
    implementation libs.hilt.android
    annotationProcessor libs.hilt.compiler
    annotationProcessor(libs.room.compiler)
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}